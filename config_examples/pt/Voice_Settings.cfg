# =====================================================================
#  Klipper-Voice - definições da TUA máquina
#
#  Este ficheiro é teu: o install.sh copia-o uma vez para
#  ~/printer_data/config/ e nunca mais o reescreve.
#  Para ajuda a preenchê-lo, usa o PROMPT_AI.md do repositório com o
#  assistente de IA que preferires.
# =====================================================================

[gcode_macro _BLV_CONFIG]
# --- Parafusos da cama ------------------------------------------------
# Coordenadas do BICO quando a PROBE está por cima de cada parafuso
# (a mesma convenção do [screws_tilt_adjust] do Klipper).
#   bico X = parafuso X - x_offset da probe
#   bico Y = parafuso Y - y_offset da probe
# O 1.º parafuso é a referência (não se mexe nele).
# Formato: [[X, Y, 'nome'], ...]   - o nome é dito em voz alta.
# EXEMPLO - SUBSTITUIR PELOS VALORES MEDIDOS NA TUA MÁQUINA:
variable_screws: [[30, 30, 'frente esquerda'], [200, 30, 'frente direita'], [200, 200, 'fundo direito'], [30, 200, 'fundo esquerdo']]

# Passo do parafuso, mm por volta: M3 = 0.5 | M4 = 0.7 | M5 = 0.8
variable_pitch: 0.7
# 1 se "Aperta" afinal SUBIR a cama na tua máquina
variable_invert: 0

# --- Afinação ---------------------------------------------------------
variable_tolerance: 0.015       # mm aceites como "certo" (0.015 com M4 ~ 8 graus)
variable_oks_needed: 2          # leituras "certo" seguidas para avançar
variable_max_passes: 4          # voltas completas de verificação
variable_pause: 4.0             # segundos entre leituras (tempo para ouvir a frase)

# --- Preparação -------------------------------------------------------
variable_bed_temp: 60           # temperatura da cama (0 = não aquece)
variable_soak_minutes: 3        # minutos de espera depois de aquecer
variable_home: "G28"            # comando de home (ex.: "G28" ou uma macro tua)
variable_safe_z: 5              # altura mínima (mm) nas deslocações
variable_speed_xy: 6000         # mm/min
variable_speed_z: 900           # mm/min

# Mensagem na consola no fim (vazio = nada)
variable_next_steps: "fazer a malha (BED_MESH_CALIBRATE), SAVE_CONFIG e confirmar o Z offset"

# --- Frases ditas -----------------------------------------------------
variable_txt_heating: "A aquecer a cama"
variable_txt_soaking: "A estabilizar"
variable_txt_minutes: "minutos"
variable_txt_reference: "A medir a referência"
variable_txt_screw: "Parafuso"
variable_txt_tighten: "Aperta"
variable_txt_loosen: "Alivia"
variable_txt_turn: "volta"
variable_txt_turns: "voltas"
variable_txt_degrees: "graus"
variable_txt_and: "e"
variable_txt_ok: "Certo"
variable_txt_recheck: "Nova verificação"
variable_txt_done: "Cama nivelada"
variable_txt_gave_up: "Parei aqui. Ainda não está perfeita"
variable_txt_stopped: "Nivelamento parado"
gcode:
