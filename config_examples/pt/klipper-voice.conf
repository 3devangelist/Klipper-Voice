# =====================================================================
#  klipper-voice.conf - configuração do serviço de voz (Klipper-Voice)
#
#  Este ficheiro é TEU: o install.sh copia-o uma vez para
#  ~/printer_data/config/ e nunca mais o reescreve.
#  Depois de mudar, reinicia o serviço "klipper-voice"
#  (Mainsail/Fluidd: menu de serviços | SSH: sudo systemctl restart klipper-voice)
# =====================================================================

[general]
# Endereço do Moonraker (normalmente não é preciso mudar)
moonraker = ws://127.0.0.1:7125/websocket
# Frase ao arrancar (vazio = calado)
startup = Voz pronta

[voice]
# piper  = voz natural (recomendado)
# espeak = voz robótica, mais leve
# text   = não fala, só escreve no registo (testes sem altifalante)
engine = piper
# Modelo de voz do piper (o install.sh descarrega-o para aqui)
model = ~/klipper-voice-voices/voice.onnx
# 1.0 = velocidade normal; maior = mais devagar
length_scale = 1.4
# Tratamento do som (sox) para altifalantes pequenos:
# corta graves, comprime e normaliza o mais alto possível sem distorcer
effects = highpass 250 compand 0.05,0.2 6:-70,-60,-30,-15,-15,-6,0,-3 -3 -90 0.1 gain -n -1
# Comando do espeak (língua, velocidade, volume)
espeak = espeak-ng -v pt -s 165 -a 140
# Placa de som para o aplay (vazio = a de omissão). Ex.: plughw:0,0
# Ver as placas com: aplay -l
device =

[sounds]
# Pasta dos sons (wav, mp3, ogg...). Fica dentro do config para poderes
# enviar ficheiros pelo Mainsail/Fluidd.
folder = ~/printer_data/config/voice_sounds

[events]
# Ditos automaticamente, sem mexer nas macros.
# Cada evento: textos e sons ("sound:ficheiro") separados por "|".
# Vazio = calado.
start =
complete = sound:done.wav | Impressão terminada
cancelled = Impressão cancelada
paused = sound:alert.wav | Impressão em pausa
resumed = A retomar a impressão
error = sound:error.wav | Erro na impressão
# Klipper parado (shutdown, "Timer too close", MCU desligado...)
shutdown = sound:error.wav | Atenção, o Klipper parou
# yes = dizer também a mensagem do Klipper (em inglês)
say_error_message = no

[night]
# Modo noite: entre "start" e "end" fica calado
enabled = no
start = 23:00
end = 08:00
# yes = mesmo de noite, os erros e paragens são ditos
allow_errors = yes
