# =====================================================================
#  Klipper-Voice - YOUR machine settings
#
#  This file is yours: install.sh copies it once into
#  ~/printer_data/config/ and never overwrites it.
#  Need help filling it in? Use PROMPT_AI.md from the repository with
#  the AI assistant of your choice.
# =====================================================================

[gcode_macro _BLV_CONFIG]
# --- Bed screws -------------------------------------------------------
# NOZZLE coordinates when the PROBE is over each screw
# (same convention as Klipper's [screws_tilt_adjust]).
#   nozzle X = screw X - probe x_offset
#   nozzle Y = screw Y - probe y_offset
# The 1st screw is the reference (never adjusted).
# Format: [[X, Y, 'name'], ...]   - the name is spoken aloud.
# EXAMPLE - REPLACE WITH THE VALUES MEASURED ON YOUR MACHINE:
variable_screws: [[30, 30, 'front left'], [200, 30, 'front right'], [200, 200, 'rear right'], [30, 200, 'rear left']]

# Screw pitch, mm per turn: M3 = 0.5 | M4 = 0.7 | M5 = 0.8
variable_pitch: 0.7
# 1 if "Tighten" actually RAISES the bed on your machine
variable_invert: 0

# --- Tuning -----------------------------------------------------------
variable_tolerance: 0.015       # mm accepted as "OK" (0.015 on M4 ~ 8 degrees)
variable_oks_needed: 2          # consecutive "OK" readings to move on
variable_max_passes: 4          # full verification passes
variable_pause: 4.0             # seconds between readings (time to hear the phrase)

# --- Preparation ------------------------------------------------------
variable_bed_temp: 60           # bed temperature (0 = no heating)
variable_soak_minutes: 3        # wait after heating
variable_home: "G28"            # homing command (e.g. "G28" or your own macro)
variable_safe_z: 5              # minimum Z (mm) for travel moves
variable_speed_xy: 6000         # mm/min
variable_speed_z: 900           # mm/min

# Console message at the end (empty = none)
variable_next_steps: "run BED_MESH_CALIBRATE, SAVE_CONFIG and check your Z offset"

# --- Spoken phrases ---------------------------------------------------
variable_txt_heating: "Heating the bed"
variable_txt_soaking: "Soaking"
variable_txt_minutes: "minutes"
variable_txt_reference: "Measuring the reference"
variable_txt_screw: "Screw"
variable_txt_tighten: "Tighten"
variable_txt_loosen: "Loosen"
variable_txt_turn: "turn"
variable_txt_turns: "turns"
variable_txt_degrees: "degrees"
variable_txt_and: "and"
variable_txt_ok: "OK"
variable_txt_recheck: "Checking again"
variable_txt_done: "Bed is level"
variable_txt_gave_up: "Stopping here. The bed is not perfect yet"
variable_txt_stopped: "Leveling stopped"
gcode:
