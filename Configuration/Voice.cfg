# =====================================================================
#  Klipper-Voice - base macros
#
#  These macros only write messages to the console; the speaking is done
#  by the separate "klipper-voice" service. If the voice hangs, Klipper
#  is not affected.
#
#  SAY MSG="text"                -> speaks the text
#  PLAY_SOUND FILE=done          -> plays a sound from voice_sounds/done/
#                                   (folders: pause, done, introcall)
#  SAY_REPEAT SEC=60 MSG="text"  -> repeats until SAY_STOP or the print
#                                   resumes
#  SAY_STOP                      -> stops the repetition
#
#  VOICE                         -> test phrase + volume, speed and on/off
#                                   in the console
#  VOICE VOLUME=70               -> volume 0..100 (voice and sounds)
#  VOICE SPEED=1.6               -> speaking speed (1.0 normal, higher =
#                                   slower)
#                                   VOLUME and SPEED are applied at once and
#                                   saved in Voice_Settings.cfg; they can go
#                                   together: VOICE VOLUME=70 SPEED=1.6
#  VOICE MUTE=1 / VOICE MUTE=0   -> mute / unmute (errors are always spoken)
#  VOICE EVENT=complete MSG="text"
#                                -> new phrase for an automatic event, for
#                                   the current print (ideal in the slicer's
#                                   start G-code). MSG="" silences it.
#  VOICE RESET=1                 -> back to the phrases in Voice_Messages.cfg
#
#  Events: start nozzle_heating nozzle_hot bed_heating bed_hot progress
#          paused resumed complete cancelled error shutdown
#  (in "progress", {p} is replaced by the percentage)
#
#  In SAY_REPEAT, sounds and texts can be combined with "|":
#    SAY_REPEAT SEC=60 MSG="sound:pause | Filament runout"
#  Never use ";" or "#" inside MSG: Klipper treats them as comments.
#  Double quotes inside MSG are turned into single quotes.
#
#  Do not edit this file: it is updated with the repository.
#  What the printer says lives in Voice_Messages.cfg (yours).
# =====================================================================

[respond]

[gcode_macro SAY]
description: Speaks a text through the host speaker. Usage: SAY MSG="text"
gcode:
    {% set msg = params.MSG|default("")|string|replace('"', "'") %}
    {% if msg %}
      RESPOND PREFIX="SAY:" MSG="{msg}"
    {% endif %}

[gcode_macro PLAY_SOUND]
description: Plays a sound from voice_sounds. Usage: PLAY_SOUND FILE=done (a folder) or FILE=my.mp3
gcode:
    {% set f = params.FILE|default("")|string %}
    {% if f %}
      RESPOND PREFIX="SOUND:" MSG="{f}"
    {% endif %}

[gcode_macro SAY_REPEAT]
description: Repeats a warning until SAY_STOP or the print resumes. Usage: SAY_REPEAT SEC=60 MSG="text"
gcode:
    {% set sec = params.SEC|default(60)|float %}
    {% set msg = params.MSG|default("")|string|replace('"', "'") %}
    {% if msg %}
      RESPOND PREFIX="VOICE_CTL:" MSG="repeat {sec} {msg}"
    {% endif %}

[gcode_macro SAY_STOP]
description: Stops the repeated warning
gcode:
    RESPOND PREFIX="VOICE_CTL:" MSG="stop"

[gcode_macro VOICE]
description: Voice control. VOICE = test + status | VOLUME=0..100 | SPEED=1.6 | MUTE=1 or 0 | EVENT=complete MSG="text" (this print) | RESET=1
gcode:
    {% set has_args = params.VOLUME is defined or params.SPEED is defined
                      or params.MUTE is defined or params.EVENT is defined
                      or params.RESET is defined %}
    {% if params.MSG is defined and params.EVENT is not defined %}
      {action_raise_error("VOICE: MSG= goes with EVENT=, e.g. VOICE EVENT=complete MSG='text'. To just speak, use SAY MSG='text'")}
    {% endif %}
    {% if params.RESET is defined and params.RESET|int == 1 %}
      RESPOND PREFIX="VOICE_CTL:" MSG="reset"
    {% endif %}
    {% if params.EVENT is defined %}
      {% set ev = params.EVENT|string|lower %}
      {% set msg = params.MSG|default("")|string|replace('"', "'") %}
      RESPOND PREFIX="VOICE_CTL:" MSG="set {ev} {msg}"
    {% endif %}
    {% if params.MUTE is defined %}
      RESPOND PREFIX="VOICE_CTL:" MSG="{'off' if params.MUTE|int == 1 else 'on'}"
    {% endif %}
    {% if params.VOLUME is defined %}
      # with SPEED too, only one sample phrase (after the speed)
      RESPOND PREFIX="VOICE_CTL:" MSG="volume {params.VOLUME|float}{' quiet' if params.SPEED is defined else ''}"
    {% endif %}
    {% if params.SPEED is defined %}
      RESPOND PREFIX="VOICE_CTL:" MSG="speed {params.SPEED|float}"
    {% endif %}
    {% if not has_args %}
      # speaks variable_test from Voice_Messages.cfg (in your language)
      RESPOND PREFIX="VOICE_CTL:" MSG="status"
      RESPOND PREFIX="VOICE_CTL:" MSG="test"
    {% endif %}
