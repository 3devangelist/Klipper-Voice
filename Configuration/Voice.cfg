# =====================================================================
#  Klipper-Voice - base macros
#
#  These macros only write messages to the console; the speaking is done
#  by the separate "klipper-voice" service. If the voice hangs, Klipper
#  is not affected.
#
#  SAY MSG="text"                -> speaks the text
#  PLAY_SOUND FILE=done.wav      -> plays a sound from voice_sounds/
#  SAY_REPEAT SEC=60 MSG="text"  -> repeats until SAY_STOP or the print
#                                   resumes
#  SAY_STOP                      -> stops the repetition
#  VOICE_OFF / VOICE_ON          -> mute / unmute (errors are always
#                                   spoken)
#  VOICE_TEST                    -> test phrase
#
#  In SAY_REPEAT, sounds and texts can be combined with "|":
#    SAY_REPEAT SEC=60 MSG="sound:alert.wav | Filament runout"
#  Never use ";" or "#" inside MSG: Klipper treats them as comments.
#
#  Do not edit this file: it is updated with the repository.
#  Your machine settings live in Voice_Settings.cfg.
# =====================================================================

[respond]

[gcode_macro SAY]
description: Speaks a text through the host speaker. Usage: SAY MSG="text"
gcode:
    {% set msg = params.MSG|default("")|string %}
    {% if msg %}
      RESPOND PREFIX="SAY:" MSG="{msg}"
    {% endif %}

[gcode_macro PLAY_SOUND]
description: Plays a sound from voice_sounds. Usage: PLAY_SOUND FILE=done.wav
gcode:
    {% set f = params.FILE|default("")|string %}
    {% if f %}
      RESPOND PREFIX="SOUND:" MSG="{f}"
    {% endif %}

[gcode_macro SAY_REPEAT]
description: Repeats a warning until SAY_STOP or the print resumes. Usage: SAY_REPEAT SEC=60 MSG="text"
gcode:
    {% set sec = params.SEC|default(60)|float %}
    {% set msg = params.MSG|default("")|string %}
    {% if msg %}
      RESPOND PREFIX="VOICE_CTL:" MSG="repeat {sec} {msg}"
    {% endif %}

[gcode_macro SAY_STOP]
description: Stops the repeated warning
gcode:
    RESPOND PREFIX="VOICE_CTL:" MSG="stop"

[gcode_macro VOICE_OFF]
description: Mutes the voice (errors are still spoken)
gcode:
    RESPOND PREFIX="VOICE_CTL:" MSG="off"

[gcode_macro VOICE_ON]
description: Unmutes the voice
gcode:
    RESPOND PREFIX="VOICE_CTL:" MSG="on"

[gcode_macro VOICE_TEST]
description: Voice test phrase
gcode:
    # speaks the "startup" phrase from klipper-voice.conf (in your language)
    RESPOND PREFIX="VOICE_CTL:" MSG="test"
