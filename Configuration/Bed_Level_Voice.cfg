# =====================================================================
#  Klipper-Voice - VOICE-GUIDED BED LEVELING (manual screws + probe)
#
#  BED_LEVEL_VOICE                -> heat, soak, home and start
#  BED_LEVEL_VOICE BED=80 SOAK=5  -> other temperature / soak (minutes)
#  BED_LEVEL_VOICE SOAK=0         -> no soak (testing)
#  BED_LEVEL_VOICE_STOP           -> abort
#
#  How it works:
#   1. probes the 1st screw (reference - never adjusted)
#   2. parks over the next screw, probing continuously, and says
#      "Tighten 45 degrees" / "Loosen 1 turn and 30 degrees" / "OK"
#   3. after N "OK" readings in a row it moves on by itself
#   4. at the end it does a verification pass; if any screw was off on
#      its first reading, it goes round again (up to max_passes)
#
#  Requires: Voice.cfg, a probe ([probe], [bltouch]...) and your
#  machine settings in [gcode_macro _BLV_CONFIG] (Voice_Settings.cfg).
#  All spoken phrases come from _BLV_CONFIG, so they follow your language.
#
#  Do not edit this file: it is updated with the repository.
# =====================================================================

# Internal state (do not touch)
[gcode_macro _BLV]
variable_z_ref: 0.0
variable_current: 0
variable_readings: 0
variable_oks: 0
variable_running: 0
variable_pass_ok: 1
variable_pass_no: 1
gcode:

[gcode_macro _BLV_SAY]
gcode:
    SAY MSG="{params.MSG}"
    M117 {params.MSG}

[gcode_macro BED_LEVEL_VOICE]
description: Manual bed leveling with continuous voice guidance
gcode:
    {% if "gcode_macro _BLV_CONFIG" not in printer %}
      {action_raise_error("BED_LEVEL_VOICE: missing [gcode_macro _BLV_CONFIG] (see Voice_Settings.cfg)")}
    {% endif %}
    {% set c = printer["gcode_macro _BLV_CONFIG"] %}
    {% if c.screws|length < 2 %}
      {action_raise_error("BED_LEVEL_VOICE: define at least 2 screws in variable_screws (Voice_Settings.cfg)")}
    {% endif %}
    {% set BED = params.BED|default(c.bed_temp)|float %}
    {% set SOAK = params.SOAK|default(c.soak_minutes)|float %}
    UPDATE_DELAYED_GCODE ID=_blv_tick DURATION=0
    SET_GCODE_VARIABLE MACRO=_BLV VARIABLE=running VALUE=0
    SET_GCODE_VARIABLE MACRO=_BLV VARIABLE=pass_no VALUE=1
    {% if BED > 0 %}
      _BLV_SAY MSG="{c.txt_heating}"
      M190 S{BED}
      {% if SOAK > 0 %}
        _BLV_SAY MSG="{c.txt_soaking} {SOAK|int} {c.txt_minutes}"
        G4 P{(SOAK * 60000)|int}
      {% endif %}
    {% endif %}
    {c.home}
    _BLV_GO N=0

[gcode_macro _BLV_GO]
gcode:
    {% set c = printer["gcode_macro _BLV_CONFIG"] %}
    {% set v = printer["gcode_macro _BLV"] %}
    {% set n = params.N|int %}
    {% set p = c.screws[n] %}
    {% set name = p[2] if p|length > 2 else "" %}
    SET_GCODE_VARIABLE MACRO=_BLV VARIABLE=current VALUE={n}
    SET_GCODE_VARIABLE MACRO=_BLV VARIABLE=readings VALUE=0
    SET_GCODE_VARIABLE MACRO=_BLV VARIABLE=oks VALUE=0
    {% if n == 0 %}
      SET_GCODE_VARIABLE MACRO=_BLV VARIABLE=pass_ok VALUE=1
    {% endif %}
    G90
    G1 Z{[v.z_ref + 3, c.safe_z]|max} F{c.speed_z}
    G1 X{p[0]} Y{p[1]} F{c.speed_xy}
    {% if n == 0 %}
      _BLV_SAY MSG="{c.txt_reference}, {name}"
    {% else %}
      _BLV_SAY MSG="{c.txt_screw} {n + 1}, {name}"
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_BLV VARIABLE=running VALUE=1
    UPDATE_DELAYED_GCODE ID=_blv_tick DURATION=0.5

[delayed_gcode _blv_tick]
gcode:
    {% if printer["gcode_macro _BLV"].running == 1 %}
      # High SAMPLES_TOLERANCE: turning the screw mid-probe does not raise
      # an error, it just gives one bad reading that the next one corrects
      PROBE SAMPLES=2 SAMPLES_TOLERANCE=1
      _BLV_EVAL
    {% endif %}

[gcode_macro _BLV_EVAL]
gcode:
    # rendered after PROBE -> last_z_result already holds the new value
    {% set c = printer["gcode_macro _BLV_CONFIG"] %}
    {% set v = printer["gcode_macro _BLV"] %}
    {% set z = printer.probe.last_z_result %}
    {% set n = v.current %}
    {% if n == 0 %}
      SET_GCODE_VARIABLE MACRO=_BLV VARIABLE=z_ref VALUE={z}
      RESPOND MSG="Reference: triggered at Z={'%.3f' % z}"
      G1 Z{z + 3} F{c.speed_z}
      _BLV_GO N=1
    {% else %}
      {% set d = z - v.z_ref %}
      {% set ok = d|abs <= c.tolerance %}
      {% set deg = ((d|abs / c.pitch * 360 / 5)|round(0)|int) * 5 %}
      {% set turns = deg // 360 %}
      {% set rest = deg % 360 %}
      RESPOND MSG="S{n + 1}: {'%+.3f' % d} mm ({deg} deg)"
      {% if v.readings == 0 and not ok %}
        SET_GCODE_VARIABLE MACRO=_BLV VARIABLE=pass_ok VALUE=0
      {% endif %}
      SET_GCODE_VARIABLE MACRO=_BLV VARIABLE=readings VALUE={v.readings + 1}
      G1 Z{z + 2} F{c.speed_z}
      {% if ok %}
        {% if v.oks + 1 >= c.oks_needed %}
          {% if n + 1 < c.screws|length %}
            _BLV_SAY MSG="{c.txt_ok}"
            _BLV_GO N={n + 1}
          {% elif v.pass_ok == 1 %}
            _BLV_END MSG="{c.txt_done}"
          {% elif v.pass_no >= c.max_passes %}
            _BLV_END MSG="{c.txt_gave_up}"
          {% else %}
            SET_GCODE_VARIABLE MACRO=_BLV VARIABLE=pass_no VALUE={v.pass_no + 1}
            _BLV_SAY MSG="{c.txt_recheck}"
            _BLV_GO N=0
          {% endif %}
        {% else %}
          SET_GCODE_VARIABLE MACRO=_BLV VARIABLE=oks VALUE={v.oks + 1}
          _BLV_SAY MSG="{c.txt_ok}"
          UPDATE_DELAYED_GCODE ID=_blv_tick DURATION={c.pause}
        {% endif %}
      {% else %}
        SET_GCODE_VARIABLE MACRO=_BLV VARIABLE=oks VALUE=0
        # d > 0: bed is high at this screw -> lower it
        {% set lower = (d > 0) != (c.invert == 1) %}
        {% set action = c.txt_tighten if lower else c.txt_loosen %}
        {% set t_turns = ("1 " ~ c.txt_turn if turns == 1 else (turns ~ " " ~ c.txt_turns)) if turns > 0 else "" %}
        {% set t_deg = (rest ~ " " ~ c.txt_degrees) if rest > 0 else "" %}
        {% set join = (" " ~ c.txt_and ~ " ") if (t_turns and t_deg) else "" %}
        _BLV_SAY MSG="{action} {t_turns}{join}{t_deg}"
        UPDATE_DELAYED_GCODE ID=_blv_tick DURATION={c.pause}
      {% endif %}
    {% endif %}

[gcode_macro _BLV_END]
gcode:
    {% set c = printer["gcode_macro _BLV_CONFIG"] %}
    UPDATE_DELAYED_GCODE ID=_blv_tick DURATION=0
    SET_GCODE_VARIABLE MACRO=_BLV VARIABLE=running VALUE=0
    G90
    G1 Z{printer["gcode_macro _BLV"].z_ref + 10} F{c.speed_z}
    _BLV_SAY MSG="{params.MSG|default(c.txt_stopped)}"
    {% if c.next_steps %}
      RESPOND MSG="Next: {c.next_steps}"
    {% endif %}

[gcode_macro BED_LEVEL_VOICE_STOP]
description: Aborts the voice-guided bed leveling
gcode:
    _BLV_END MSG="{printer['gcode_macro _BLV_CONFIG'].txt_stopped}"
